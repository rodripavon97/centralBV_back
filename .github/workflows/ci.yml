name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'feat/*'
      - 'feat/**'
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint · Test · Build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      # Ejecuta tests y genera la cobertura
      - name: Run tests
        run: pnpm run test -- --coverage

      # Genera el badge de Vitest usando npx directamente
      - name: Generar Badge de Cobertura
        run: npx vitest-coverage-report-badge

      # Commitea el badge generado de vuelta a tu repositorio
      - name: Commit Badge
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add ./coverage/badge-*.svg || true
          git commit -m "chore: update coverage badge [skip ci]" -a || true
          git push

      - name: Build
        run: pnpm run build
