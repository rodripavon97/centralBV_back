name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'feat/*'
      - 'feat/**'
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint · Test · Build
    runs-on: ubuntu-latest

    # Necesitamos permisos de escritura para que la acción pueda guardar la imagen del badge en el repositorio
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      # 1. Modificamos el comando para asegurar que genere el reporte json-summary
      - name: Run tests
        run: pnpm run test -- --coverage --coverageReporters="json-summary"

      # 2. Agregamos la acción que lee ese json y genera el badge (.svg)
      - name: Generar Badge de Cobertura
        uses: jpb06/coverage-badges-generation-action@v2
        with:
          coverage-summary-path: './coverage/coverage-summary.json'
          badges-icon: 'test-generic'

      # Tu paso de compilación sigue igual
      - name: Build
        run: pnpm run build
