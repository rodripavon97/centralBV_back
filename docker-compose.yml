# Docker Compose para CentralBV Backend (API NestJS)
# Características del proyecto: NestJS 12 + TypeScript/ESM, pnpm, build multi-stage.
# Persistencia/auth externa: Supabase Cloud (no se levanta BD local aquí).
# Uso:
#   1) Copiar .env.example a .env y completar valores reales (no versionar .env).
#   2) docker compose up --build

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: centralbv-back:local
    container_name: centralbv-back
    env_file:
      - path: .env
        required: false
    environment:
      # Por defecto "production" (imagen/arranque tipo prod). Para pruebas locales
      # sin flujo de producción podés sobreescribir: NODE_ENV=development en .env
      # o al ejecutar compose.
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-}
      PASSWORD_RESET_REDIRECT_URL: ${PASSWORD_RESET_REDIRECT_URL:-}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-2525}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASS: ${MAIL_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    restart: unless-stopped
    healthcheck:
      # Usa el endpoint de liveness expuesto por @nestjs/terminus (src/health).
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
